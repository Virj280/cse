<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number 1 Player</title>
</head>
<body>
    <input type="button" value="Easy" onclick="setRandom(1)"> <!-- 1 digit number -->
    <input type="button" value="Medium" onclick="setRandom(2)"> <!-- 2 digit number -->
    <input type="button" value="Hard" onclick="setRandom(3)"><!-- 3 digit number -->

    <script>
        var secret = "";
        function setRandom(level){
            while(level > 0){
                let n = (Math.floor(Math.random() * 10));
                console.log(n);
                secret = secret.concat(n);
                
                level --;
            }
            
        }
    </script>
</body>
</html>
